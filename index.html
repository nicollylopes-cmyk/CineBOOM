<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineboom - O Oscar dos Filmes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        h2.autores {
            font-size: 14px;
            color: #b3b3b3;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 {
            margin-bottom: 25px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 38px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .secao-minado {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .placar-container {
            font-size: 20px;
            margin-bottom: 10px;
            color: #bf953f;
            font-weight: bold;
        }

        #placar {
            color: #ffffff;
            background: #222;
            padding: 2px 10px;
            border-radius: 5px;
            border: 1px solid #bf953f;
            margin-left: 5px;
        }

        table#tabuleiro {
            border-spacing: 4px;
            border: 2px solid #bf953f;
            background-color: #1a1a1a;
            margin: 0 auto;
            border-radius: 8px;
        }

        table#tabuleiro td {
            width: 50px; 
            height: 50px;
            border: 1px solid #333;
            background-color: #262626;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;
        }

        table#tabuleiro td:hover {
            background-color: #3a3a3a;
            border-color: #bf953f;
        }

        #label_fim_de_jogo {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        #btn_reset {
            margin-top: 10px;
            padding: 6px 15px;
            border: 1px solid #555;
            background: #222;
            color: #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
        #btn_reset:hover {
            background: #333;
            color: #fff;
        }
        .busca-container {
            margin-bottom: 25px;
            text-align: center;
        }

        #aviso-bloqueio {
            color: #ff9900;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
        }

        form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 30px;
            width: 300px;
            font-size: 16px;
            background: #1f1f1f;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus:not(:disabled) {
            border-color: #bf953f;
            box-shadow: 0 0 10px rgba(179, 135, 40, 0.3);
        }

        input:disabled, button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #333;
            box-shadow: none;
        }

        button#btn-buscar {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #8b0000 0%, #e50914 100%);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            transition: 0.3s ease;
        }

        button#btn-buscar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
            background: linear-gradient(135deg, #e50914 0%, #ff1f2f 100%);
        }

        .filme-card {
            background: #151515;
            border: 2px solid #bf953f;
            border-radius: 20px;
            padding: 25px;
            width: 340px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            display: none;
        }

        .filme-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
        }

        .silhouette {
            filter: brightness(0) blur(2px);
        }

        .filme-name {
            margin-top: 15px;
            font-size: 24px;
            color: #fcf6ba;
        }

        .info {
            margin-top: 15px;
            border-top: 1px solid #333;
            padding-top: 15px;
            text-align: left;
        }

        .info p {
            margin: 6px 0;
            font-size: 14px;
            color: #cccccc;
        }

        .info strong {
            color: #bf953f;
        }

        #filme-hit {
            font-weight: bold;
            font-size: 18px;
            margin-top: 12px;
            text-transform: uppercase;
        }

        .error-msg {
            color: #ff4d4d;
            display: none;
            margin-bottom: 15px;
        }

        h3 {
            margin-top: 40px;
            margin-bottom: 15px;
            font-size: 20px;
            text-transform: uppercase;
            color: #bf953f;
        }

        #filmes-table {
            width: 85vw;
            max-width: 700px;
            border-collapse: separate;
            border-spacing: 0 6px;
        }

        #filmes-table th {
            background: #111;
            color: #bf953f;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid #bf953f;
        }

        #filmes-table td {
            background: #1c1c1c;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: #e0e0e0;
        }

        #filmes-table tr td:first-child { border-radius: 8px 0 0 8px; }
        #filmes-table tr td:last-child { border-radius: 0 8px 8px 0; }

        .btn-apagar {
            padding: 5px 10px ;
            font-size: 11px ;
            background: #333;
            border: 1px solid #555;
            box-shadow: none;
            border-radius: 6px;
        }
        .btn-apagar:hover {
            background: #cc0000;
            border-color: #cc0000;
        }
    </style>
</head>
<body>

    <h2 class="autores">Nicolly Souza e Samuel Morande 1025B</h2>
    <h1>Cineboom</h1>

    <div class="secao-minado">
        <div class="placar-container">
            Créditos do Campo Minado: <span id="placar">0</span>
        </div>
        <table id="tabuleiro"></table>
        <label id="label_fim_de_jogo"></label>
        <button id="btn_reset">Reiniciar Campo Minado</button>
    </div>

    <div class="busca-container">
        <div id="aviso-bloqueio">Consiga pelo menos 3 pontos no Campo Minado para liberar seu palpite!</div>
        <form method="GET">
            <input
                type="text"
                name="filme_nome"
                id="filme-input"
                placeholder="Digite o nome do filme" 
                disabled>

            <button id="btn-buscar" type="submit" disabled>
                Confirmar Palpite
            </button>
        </form>
    </div>

    <p id="erro" class="error-msg">Erro ao carregar filme.</p>

    <div id="card" class="filme-card">
        <img id="filme-img" src="" alt="Poster do Filme">
        <h2 id="filme-name" class="filme-name">????</h2>
        <div class="info">
            <p><strong>Gênero:</strong> <span id="filme-genero"></span></p>
            <p><strong>Nota:</strong> <span id="filme-nota"></span></p>
            <p><strong>Lançamento:</strong> <span id="filme-data"></span></p>
        </div>
        <p id="filme-hit"></p>
    </div>

    <div id="filmes-vistos">
        <h3>Histórico de Premiações</h3>
        <table id="filmes-table">
            <thead>
                <tr>
                    <th>Filme Real</th>
                    <th>Seu Palpite</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="filmes-tbody"></tbody>
        </table>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
